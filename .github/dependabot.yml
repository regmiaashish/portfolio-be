# Weekly dependency update PRs. CI (.github/workflows/ci.yml) must pass before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Base images and the uv image pinned in the Dockerfile (version + digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # The project is pinned to Python 3.12 (pyproject, uv.lock, CI). A tag like 3.12-alpine ->
    # 3.14-alpine counts as a "minor" bump here, so only digest/patch refreshes of the same
    # Python version are proposed; moving Python versions is a deliberate change.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  # Actions pinned to commit SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
