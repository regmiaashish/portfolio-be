[project]
name = "portfolio-website-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.51",
    "fastapi[standard]>=0.139.2",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1,<1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "python-jose>=3.5.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "TRY", "BLE", "ASYNC"]
# E501: line length is enforced by the formatter; long strings and HTML are left alone.
# TRY003: short inline messages in exceptions are fine in this codebase.
# TRY300/TRY301: try/else and raise-in-try style preferences; not worth the churn.
ignore = ["E501", "TRY003", "TRY300", "TRY301"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Cookie() defaults are the framework idiom, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie", "fastapi.Body"]
