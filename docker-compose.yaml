services:
  api:
    # The image to run. On the EC2 VM, scripts/deploy.sh sets API_IMAGE in .env to the image CI
    # published (ghcr.io/regmiaashish/portfolio-be:sha-<commit>), so the VM never builds.
    # Locally it stays unset: `docker compose build` builds and tags portfolio-be-api:latest.
    image: ${API_IMAGE:-portfolio-be-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-server
    restart: always
    ports:
      # Host port from API_HOST_PORT in .env: 80 on the EC2 VM behind Cloudflare, 443 once the
      # container serves TLS (docs/ORIGIN_TLS.md).
      - "${API_HOST_PORT:-8001}:8001"
    env_file:
      - .env
    # Least privilege: no root (set in the Dockerfile), no Linux capabilities, no setuid
    # escalation, and a read-only filesystem apart from scratch space.
    read_only: true
    tmpfs:
      # RAM-backed scratch space, capped. Uploads over 1 MB are spooled here while being read
      # (max S3_MAX_UPLOAD_MB, 5 MB by default, admin only); tavily's tokenizer cache is ~2 MB.
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
